
<!DOCTYPE html>
<html lang="tr">
<head><base href="https://d16ilfvy4mv02r.cloudfront.net/workspaces/oMmdrJQDICDrldpSVkoRt22haa1M92Fp/fb9645d4-074f-44dd-9ed4-0bc1fc8f31d3/files/">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ografy — Yapay Zeka Asistanı</title>
<style>
  :root {
    --bg: #0b0d12; --bg-2: #11141c; --panel: #161a24; --panel-2: #1d2230;
    --border: #262c3b; --text: #e7ebf3; --muted: #8b94a8;
    --accent: #6c8cff; --accent-2: #a06bff; --user-bubble: #26304a;
    --ok: #35d07f; --shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    background: radial-gradient(1200px 700px at 15% -10%, #1a2138 0%, var(--bg) 55%) fixed;
    color: var(--text); display: flex; height: 100vh; overflow: hidden;
  }
  #sidebar { width: 270px; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: margin-left .25s ease; flex-shrink: 0; }
  #sidebar.collapsed { margin-left: -270px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-weight: 800; font-size: 17px; box-shadow: 0 6px 18px rgba(108,140,255,.35); }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  .brand small { color: var(--muted); font-size: 11px; display: block; }
  .newchat { margin: 6px 14px 12px; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--border); background: linear-gradient(135deg, rgba(108,140,255,.16), rgba(160,107,255,.12)); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: .18s; }
  .newchat:hover { border-color: var(--accent); transform: translateY(-1px); }
  .history { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .history-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; padding: 10px 8px 6px; }
  .hist-item { padding: 9px 10px; border-radius: 9px; font-size: 13.5px; color: #c3cad9; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
  .hist-item:hover { background: var(--panel); }
  .hist-item.active { background: var(--panel-2); color: #fff; }
  .hist-item .del { margin-left: auto; opacity: 0; color: var(--muted); font-size: 15px; }
  .hist-item:hover .del { opacity: 1; }
  .hist-item .del:hover { color: #ff6b6b; }
  .side-foot { padding: 12px 14px; border-top: 1px solid var(--border); }
  .settings-btn { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 13.5px; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .settings-btn:hover { border-color: var(--accent); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { height: 58px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 18px; background: rgba(11,13,18,.6); backdrop-filter: blur(10px); }
  #menuBtn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 6px; border-radius: 8px; }
  #menuBtn:hover { background: var(--panel); color: var(--text); }
  .chat-title { font-size: 15px; font-weight: 600; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.off { background: #ff9f43; box-shadow: 0 0 10px #ff9f43; }
  #chat { flex: 1; overflow-y: auto; padding: 26px 20px 10px; scroll-behavior: smooth; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { display: flex; gap: 12px; margin-bottom: 22px; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .avatar { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .msg.user .avatar { background: var(--user-bubble); }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .bubble { background: var(--panel); border: 1px solid var(--border); padding: 12px 15px; border-radius: 14px; font-size: 14.5px; line-height: 1.62; max-width: 100%; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user-bubble); border-color: #313d5c; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
  .bubble pre { background: #0a0c11; border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  .bubble code { font-family: "SF Mono", Consolas, monospace; }
  .bubble :not(pre) > code { background: #0a0c11; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }
  .welcome { text-align: center; padding: 40px 10px 10px; }
  .welcome .big { width: 62px; height: 62px; border-radius: 18px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-size: 30px; font-weight: 800; box-shadow: 0 12px 34px rgba(108,140,255,.35); }
  .welcome h2 { margin: 0 0 6px; font-size: 24px; }
  .welcome p { color: var(--muted); margin: 0 0 26px; font-size: 14.5px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; max-width: 700px; margin: 0 auto; }
  .card { text-align: left; background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 14px; cursor: pointer; transition: .18s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card b { display: block; font-size: 14px; margin-bottom: 4px; }
  .card span { color: var(--muted); font-size: 12.5px; }
  #composer { padding: 14px 20px 20px; }
  .composer-inner { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: flex-end; gap: 10px; box-shadow: var(--shadow); }
  .composer-inner:focus-within { border-color: var(--accent); }
  #input { flex: 1; background: none; border: none; color: var(--text); resize: none; font-size: 15px; line-height: 1.5; max-height: 180px; padding: 6px 0; outline: none; font-family: inherit; }
  #send { width: 40px; height: 40px; border-radius: 11px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 17px; display: grid; place-items: center; transition: .18s; flex-shrink: 0; }
  #send:hover { filter: brightness(1.1); transform: translateY(-1px); }
  #send:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 460px; padding: 22px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .modal .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: #c3cad9; }
  .field input, .field select, .field textarea { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field small { color: var(--muted); font-size: 11.5px; display: block; margin-top: 5px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; font-weight: 600; }
  .btn:hover { filter: brightness(1.08); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 11px 18px; border-radius: 11px; font-size: 13.5px; box-shadow: var(--shadow); transition: transform .3s ease; z-index: 80; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  @media (max-width: 720px) { #sidebar { position: fixed; z-index: 40; height: 100%; } #sidebar:not(.collapsed) + #main::after { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; } }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #2b3245; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4259; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="logo">O</div>
    <div><h1>Ografy</h1><small>Yapay Zeka Asistanı</small></div>
  </div>
  <button class="newchat" id="newChat">＋ Yeni sohbet</button>
  <div class="history" id="history"><div class="history-label">Sohbetler</div></div>
  <div class="side-foot">
    <button class="settings-btn" id="openSettings">⚙️ Ayarlar / API</button>
  </div>
</aside>

<main id="main">
  <header>
    <button id="menuBtn" title="Menü">☰</button>
    <div class="chat-title" id="chatTitle">Yeni sohbet</div>
    <div class="status"><span class="dot off" id="statusDot"></span><span id="statusText">Demo modu</span></div>
  </header>

  <div id="chat"><div class="wrap" id="chatWrap"></div></div>

  <div id="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="Ografy'ye bir şey sor… (Enter = gönder, Shift+Enter = alt satır)"></textarea>
      <button id="send" title="Gönder">➤</button>
    </div>
    <div class="hint">Ografy hata yapabilir. Önemli bilgileri doğrula.</div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Ayarlar</h3>
    <p class="sub">Gerçek yanıtlar için bir OpenAI uyumlu API anahtarı gir. Girmezsen Ografy demo modunda çalışır.</p>
    <div class="field">
      <label>API Anahtarı</label>
      <input type="password" id="apiKey" placeholder="sk-… (yalnızca bu tarayıcıda saklanır)" />
      <small>Anahtar localStorage'da tutulur, hiçbir sunucuya gönderilmez.</small>
    </div>
    <div class="field">
      <label>API Adresi (base URL)</label>
      <input type="text" id="baseUrl" value="https://api.openai.com/v1" />
    </div>
    <div class="field">
      <label>Model</label>
      <input type="text" id="model" value="gpt-4o-mini" />
    </div>
    <div class="field">
      <label>Sistem Talimatı</label>
      <textarea id="systemPrompt" rows="3">Sen Ografy adında, Türkçe konuşan, net ve pratik bir yapay zeka asistanısın. Kullanıcının isteğini dikkatle analiz eder, yapılandırılmış ve gereksiz tekrardan uzak yanıtlar verirsin.</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" id="clearHistory">Geçmişi temizle</button>
      <button class="btn" id="closeSettings">Kapat</button>
      <button class="btn primary" id="saveSettings">Kaydet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const chatWrap = $("chatWrap");
  const input = $("input");
  const send = $("send");
  const chat = $("chat");

  const LS = { chats: "ogrady_chats_v1", cfg: "ogrady_cfg_v1" };

  let config = loadCfg();
  let chats = loadChats();
  let activeId = null;
  let busy = false;

  function loadCfg() {
    try {
      return Object.assign({
        apiKey: "",
        baseUrl: "https://api.openai.com/v1",
        model: "gpt-4o-mini",
        systemPrompt: "Sen Ografy adında, Türkçe konuşan, net ve pratik bir yapay zeka asistanısın. Kullanıcının isteğini dikkatle analiz eder, yapılandırılmış ve gereksiz tekrardan uzak yanıtlar verirsin."
      }, JSON.parse(localStorage.getItem(LS.cfg) || "{}"));
    } catch { return { apiKey: "", baseUrl: "https://api.openai.com/v1", model: "gpt-4o-mini", systemPrompt: "Sen Ografy'sin." }; }
  }
  function saveCfg() { localStorage.setItem(LS.cfg, JSON.stringify(config)); }
  function loadChats() { try { return JSON.parse(localStorage.getItem(LS.chats) || "[]"); } catch { return []; } }
  function saveChats() { localStorage.setItem(LS.chats, JSON.stringify(chats)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function currentChat() { return chats.find(c => c.id === activeId) || null; }

  function newChat() {
    const c = { id: uid(), title: "Yeni sohbet", messages: [] };
    chats.unshift(c); activeId = c.id; saveChats(); renderHistory(); renderChat();
    $("chatTitle").textContent = c.title; input.focus();
  }
  function ensureChat() { if (!currentChat()) newChat(); return currentChat(); }

  function renderHistory() {
    const box = $("history");
    box.innerHTML = '<div class="history-label">Sohbetler</div>';
    chats.forEach(c => {
      const d = document.createElement("div");
      d.className = "hist-item" + (c.id === activeId ? " active" : "");
      d.innerHTML = '<span>💬</span><span style="overflow:hidden;text-overflow:ellipsis">' + escapeHtml(c.title) + '</span><span class="del" title="Sil">×</span>';
      d.addEventListener("click", (e) => {
        if (e.target.classList.contains("del")) { deleteChat(c.id); return; }
        activeId = c.id; renderHistory(); renderChat();
        $("chatTitle").textContent = c.title;
      });
      box.appendChild(d);
    });
  }
  function deleteChat(id) {
    chats = chats.filter(c => c.id !== id);
    if (activeId === id) activeId = chats[0] ? chats[0].id : null;
    saveChats(); renderHistory();
    if (activeId) { renderChat(); $("chatTitle").textContent = currentChat().title; }
    else newChat();
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

  function renderMarkdown(text) {
    let t = escapeHtml(text);
    t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => '<pre><code>' + code.replace(/\n$/, "") + '</code></pre>');
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/^### (.*)$/gm, '<p><strong>$1</strong></p>');
    t = t.replace(/^## (.*)$/gm, '<p><strong>$1</strong></p>');
    t = t.replace(/^\s*[-•] (.*)$/gm, '<li>$1</li>');
    t = t.replace(/^\s*\d+\. (.*)$/gm, '<li>$1</li>');
    t = t.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
    t = t.split(/\n{2,}/).map(p => {
      if (/^<(ul|pre|p|li)/.test(p.trim()) || p.includes("<ul>")) return p;
      return '<p>' + p.replace(/\n/g, "<br>") + '</p>';
    }).join("");
    return t;
  }

  function renderChat() {
    const c = currentChat();
    chatWrap.innerHTML = "";
    if (!c || c.messages.length === 0) { renderWelcome(); return; }
    c.messages.forEach(m => addMessageEl(m.role, m.content, false));
    scrollBottom();
  }

  function renderWelcome() {
    chatWrap.innerHTML = `
      <div class="welcome">
        <div class="big">O</div>
        <h2>Merhaba, ben Ografy 👋</h2>
        <p>Ne yapmak istersin? Aşağıdan bir örnek seç ya da kendi isteğini yaz.</p>
        <div class="cards">
          <div class="card" data-p="Bana 5 maddelik bir pazarlama planı hazırla"><b>📈 Pazarlama planı</b><span>5 maddelik, uygulanabilir bir plan</span></div>
          <div class="card" data-p="Modern, tek sayfalık responsive bir web sitesi kodu yaz"><b>💻 Web sitesi kodu</b><span>HTML/CSS/JS tek dosya</span></div>
          <div class="card" data-p="Güncel yapay zeka gelişmelerini araştır ve özetle"><b>🔎 Araştırma</b><span>Güncel bilgi + özet</span></div>
          <div class="card" data-p="Instagram için 1 haftalık içerik takvimi oluştur"><b>📱 Sosyal medya</b><span>1 haftalık içerik takvimi</span></div>
        </div>
      </div>`;
    chatWrap.querySelectorAll(".card").forEach(el => {
      el.addEventListener("click", () => { input.value = el.dataset.p; sendMessage(); });
    });
  }

  function addMessageEl(role, content, animate) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = role === "user" ? "🧑" : "O";
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = role === "user" ? escapeHtml(content).replace(/\n/g, "<br>") : renderMarkdown(content);
    wrap.appendChild(av); wrap.appendChild(b);
    if (animate === false) wrap.style.animation = "none";
    chatWrap.appendChild(wrap);
    return b;
  }

  function addTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot"; wrap.id = "typingRow";
    wrap.innerHTML = '<div class="avatar">O</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    chatWrap.appendChild(wrap); scrollBottom();
  }
  function removeTyping() { const t = $("typingRow"); if (t) t.remove(); }
  function scrollBottom() { requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
  }
  function updateStatus() {
    const on = !!config.apiKey;
    $("statusDot").className = "dot" + (on ? "" : " off");
    $("statusText").textContent = on ? "Bağlı · " + config.model : "Demo modu";
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;
    const c = ensureChat();
    busy = true; send.disabled = true;
    if (c.messages.length === 0) {
      c.title = text.slice(0, 42) + (text.length > 42 ? "…" : "");
      $("chatTitle").textContent = c.title;
    }
    c.messages.push({ role: "user", content: text });
    saveChats(); renderHistory();
    if (c.messages.length === 1) chatWrap.innerHTML = "";
    addMessageEl("user", text, true);
    input.value = ""; autoGrow(); addTyping();
    try {
      let reply = config.apiKey ? await callAPI(c.messages) : await demoReply(text);
      removeTyping();
      c.messages.push({ role: "assistant", content: reply });
      saveChats(); addMessageEl("assistant", reply, true); scrollBottom();
    } catch (err) {
      removeTyping();
      addMessageEl("assistant", "⚠️ **Hata:** " + (err.message || err) + "\n\nAyarlar menüsünden API anahtarını ve model adını kontrol et.", true);
      toast("Yanıt alınamadı");
    } finally { busy = false; send.disabled = false; input.focus(); }
  }

  async function callAPI(messages) {
    const res = await fetch(config.baseUrl.replace(/\/$/, "") + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + config.apiKey },
      body: JSON.stringify({ model: config.model, messages: [{ role: "system", content: config.systemPrompt }].concat(messages), temperature: 0.7 })
    });
    if (!res.ok) {
      let detail = res.status + " " + res.statusText;
      try { const j = await res.json(); detail = (j.error && j.error.message) || detail; } catch {}
      throw new Error(detail);
    }
    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message.content) || "(boş yanıt)";
  }

  async function demoReply(text) {
    await new Promise(r => setTimeout(r, 650 + Math.random() * 600));
    const q = text.toLowerCase();
    if (q.includes("pazarlama")) {
      return "İşte **5 maddelik pazarlama planı**:\n\n1. **Hedef kitle** — Kimin için? Yaş, ilgi, sorun.\n2. **Konumlandırma** — Tek cümlelik değer önerisi.\n3. **Kanallar** — Instagram, e-posta, SEO'dan 2 tanesini seç.\n4. **İçerik takvimi** — Haftalık 3 gönderi + 1 hikâye.\n5. **Ölçüm** — Erişim, tıklama, dönüşüm; aylık gözden geçir.\n\n> Not: Gerçek AI yanıtları için **Ayarlar → API Anahtarı** gir.";
    }
    if (q.includes("web") || q.includes("site") || q.includes("kod")) {
      return "İşte tek dosyalık başlangıç:\n\n```html\n<!DOCTYPE html>\n<html lang=\"tr\">\n<head><meta charset=\"UTF-8\"><title>Merhaba</title></head>\n<body>\n  <h1>Merhaba Dünya 👋</h1>\n</body>\n</html>\n```\n\nBunu `index.html` olarak kaydedip tarayıcıda açabilirsin. Renk/tasarım eklemem ister misin?";
    }
    if (q.includes("instagram") || q.includes("sosyal")) {
      return "**1 haftalık Instagram takvimi:**\n\n- **Pzt:** Tanıtım gönderisi\n- **Sal:** Faydalı ipucu (carousel)\n- **Çar:** Hikâye anketi\n- **Per:** Müşteri yorumu\n- **Cum:** Reel (kısa video)\n- **Cmt:** Sahne arkası\n- **Paz:** Haftalık özet\n\n> Gerçek AI yanıtları için **Ayarlar → API Anahtarı** gir.";
    }
    if (q.includes("araştır") || q.includes("özet")) {
      return "Demo modunda canlı araştırma yapamam. Gerçek, güncel ve kaynaklı yanıtlar için **Ayarlar → API Anahtarı** gir ve model olarak güncel bir model seç.\n\nAnahtar girmeden de şu konularda yardımcı olabilirim: plan, taslak, kod, fikir listesi.";
    }
    return "Bunu demo modunda yanıtlıyorum. **Gerçek yapay zeka yanıtları** için sağ üstteki **Ayarlar**'dan bir API anahtarı gir.\n\nYine de şu an yardımcı olabileceğim şeyler: plan çıkarma, metin/kod taslağı, fikir listesi, tablo/karşılaştırma. Ne istersin?";
  }

  function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  send.addEventListener("click", sendMessage);

  function openSettings() {
    $("apiKey").value = config.apiKey; $("baseUrl").value = config.baseUrl;
    $("model").value = config.model; $("systemPrompt").value = config.systemPrompt;
    $("overlay").classList.add("show");
  }
  function closeSettings() { $("overlay").classList.remove("show"); }
  $("openSettings").addEventListener("click", openSettings);
  $("closeSettings").addEventListener("click", closeSettings);
  $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeSettings(); });
  $("saveSettings").addEventListener("click", () => {
    config.apiKey = $("apiKey").value.trim();
    config.baseUrl = $("baseUrl").value.trim() || "https://api.openai.com/v1";
    config.model = $("model").value.trim() || "gpt-4o-mini";
    config.systemPrompt = $("systemPrompt").value.trim();
    saveCfg(); updateStatus(); closeSettings();
    toast(config.apiKey ? "Ayarlar kaydedildi · Bağlı" : "Kaydedildi · Demo modu");
  });
  $("clearHistory").addEventListener("click", () => {
    if (!confirm("Tüm sohbet geçmişi silinsin mi?")) return;
    chats = []; saveChats(); closeSettings(); newChat(); toast("Geçmiş temizlendi");
  });
  $("newChat").addEventListener("click", newChat);
  $("menuBtn").addEventListener("click", () => $("sidebar").classList.toggle("collapsed"));

  updateStatus();
  if (chats.length) { activeId = chats[0].id; $("chatTitle").textContent = chats[0].title; }
  else newChat();
  renderHistory(); renderChat();
})();
</script>
</body>
</html>
